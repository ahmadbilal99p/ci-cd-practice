name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-ci-app .

      - name: Run container and test
        run: |
          docker run -d -p 8080:80 --name test-container my-ci-app
          sleep 3
          curl --fail http://localhost:8080 || exit 1
          docker stop test-container
